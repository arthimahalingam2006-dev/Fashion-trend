<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashion Trend - Register</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #09001b,
                    #220044,
                    #001b38
                );

            color: white;

            overflow: hidden;
        }


        /* ================= BUBBLES ================= */

        .bubble {

            position: fixed;

            border-radius: 50%;

            filter: blur(3px);

            opacity: .5;

            animation:
                move 8s infinite ease-in-out;
        }

        .one {

            width: 230px;
            height: 230px;

            background: #8b5cf6;

            top: 5%;
            left: 5%;
        }

        .two {

            width: 180px;
            height: 180px;

            background: #ec4899;

            bottom: 5%;
            right: 8%;

            animation-delay: 2s;
        }

        .three {

            width: 100px;
            height: 100px;

            background: #2196f3;

            bottom: 30%;
            left: 15%;

            animation-delay: 4s;
        }

        @keyframes move {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(45px, -40px);
            }

        }


        /* ================= REGISTER CARD ================= */

        .card {

            width: 390px;

            padding: 35px;

            border-radius: 28px;

            background:
                rgba(255,255,255,.11);

            border:
                1px solid
                rgba(255,255,255,.25);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.4);

            text-align: center;

            z-index: 2;
        }


        /* ================= LOGO ================= */

        .logo {

            width: 80px;

            height: 80px;

            object-fit: cover;

            border-radius: 50%;

            margin-bottom: 10px;
        }


        h1 {

            margin:
                5px 0 8px;

            font-size: 25px;
        }

        p {

            opacity: .8;
        }


        /* ================= INPUT ================= */

        input {

            width: 100%;

            padding: 14px;

            margin: 9px 0;

            border: none;

            outline: none;

            border-radius: 13px;

            background:
                rgba(255,255,255,.14);

            color: white;

            font-size: 15px;
        }

        input::placeholder {

            color: #ddd;
        }

        input:focus {

            box-shadow:
                0 0 0 2px
                rgba(139,92,246,.7);
        }


        /* ================= BUTTON ================= */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    90deg,
                    #8b5cf6,
                    #ec4899
                );

            color: white;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

            transition: .3s;
        }

        button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 25px
                rgba(236,72,153,.35);
        }


        /* ================= LINK ================= */

        a {

            color: #d8b4fe;

            text-decoration: none;
        }

        a:hover {

            color: #ff9fdb;
        }


        /* ================= POPUP ================= */

        .popup-overlay {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,.65);

            backdrop-filter:
                blur(6px);

            justify-content: center;

            align-items: center;

            z-index: 100;
        }


        .popup {

            width: 350px;

            padding: 30px;

            border-radius: 22px;

            text-align: center;

            background:
                rgba(255,255,255,.12);

            border:
                1px solid
                rgba(255,255,255,.25);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);

            animation:
                popupOpen .3s ease;
        }


        @keyframes popupOpen {

            from {

                transform:
                    scale(.7);

                opacity: 0;
            }

            to {

                transform:
                    scale(1);

                opacity: 1;
            }

        }


        .popup-icon {

            font-size: 50px;

            margin-bottom: 10px;
        }


        .popup h2 {

            margin:
                5px 0 10px;
        }


        .popup p {

            color: #ddd;

            font-size: 14px;

            line-height: 1.5;
        }


        .popup button {

            margin-top: 15px;

            width: 120px;

            padding: 12px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            .card {

                width: 90%;

                padding: 28px 22px;
            }

            .popup {

                width: 85%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= BUBBLES ================= -->

    <div class="bubble one"></div>

    <div class="bubble two"></div>

    <div class="bubble three"></div>


    <!-- ================= REGISTER ================= -->

    <div class="card">

        <img
            src="/images/Logo.jpeg"
            class="logo"
            alt="Fashion Trend Logo"
        >

        <h1>
            Fashion Trend Creation
        </h1>

        <p>
            Create your account
        </p>


        <input
            id="username"
            type="text"
            placeholder="Username"
        >


        <input
            id="email"
            type="email"
            placeholder="Email"
        >


        <input
            id="password"
            type="password"
            placeholder="Password"
        >


        <button onclick="registerUser()">

            Create Account

        </button>


        <p>

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>


    <!-- ================= POPUP ================= -->

    <div
        class="popup-overlay"
        id="popupOverlay"
    >

        <div class="popup">

            <div
                class="popup-icon"
                id="popupIcon"
            >
                ✨
            </div>

            <h2 id="popupTitle">
                Message
            </h2>

            <p id="popupMessage">
                Message
            </p>

            <button
                onclick="closePopup()"
            >
                OK
            </button>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>


        function showPopup(
            title,
            message,
            icon
        ) {

            document.getElementById(
                "popupTitle"
            ).textContent = title;


            document.getElementById(
                "popupMessage"
            ).textContent = message;


            document.getElementById(
                "popupIcon"
            ).textContent = icon;


            document.getElementById(
                "popupOverlay"
            ).style.display = "flex";

        }


        function closePopup() {

            document.getElementById(
                "popupOverlay"
            ).style.display = "none";

        }


        async function registerUser() {


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            /* EMPTY FIELD CHECK */

            if (
                !username ||
                !email ||
                !password
            ) {

                showPopup(
                    "Incomplete Details",
                    "Please enter all required details.",
                    "⚠️"
                );

                return;
            }


            try {


                const response =
                    await fetch(
                        "/api/register",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    username:
                                        username,

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (data.success) {


                    showPopup(
                        "Account Created!",
                        "Your account has been created successfully. Click OK to login.",
                        "✅"
                    );


                    /* OK CLICK → LOGIN */

                    document.querySelector(
                        ".popup button"
                    ).onclick =
                        function() {

                            window.location.href =
                                "/login";

                        };


                }

                else {


                    showPopup(
                        "Registration Failed",
                        data.message ||
                        "Unable to create account.",
                        "⚠️"
                    );

                }


            }

            catch (error) {


                console.error(error);


                showPopup(
                    "Connection Error",
                    "Unable to connect to the server.",
                    "❌"
                );

            }

        }


    </script>


</body>

</html>
