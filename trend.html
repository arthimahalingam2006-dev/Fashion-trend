<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Fashion Trend</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;

            background: linear-gradient(
                135deg,
                #08001c,
                #1c003b,
                #001d38
            );

            overflow-x: hidden;
        }


        /* FLOATING BUBBLES */

        .bubble {
            position: fixed;
            border-radius: 50%;
            filter: blur(5px);
            opacity: 0.45;
            z-index: -1;
            animation: float 8s infinite ease-in-out;
        }

        .b1 {
            width: 230px;
            height: 230px;
            background: #8b5cf6;
            top: 5%;
            left: 5%;
        }

        .b2 {
            width: 200px;
            height: 200px;
            background: #ec4899;
            right: 5%;
            bottom: 5%;
            animation-delay: 2s;
        }

        .b3 {
            width: 110px;
            height: 110px;
            background: #2196f3;
            left: 45%;
            top: 35%;
            animation-delay: 4s;
        }

        .b4 {
            width: 80px;
            height: 80px;
            background: #a855f7;
            right: 25%;
            top: 15%;
            animation-delay: 1s;
        }

        @keyframes float {

            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, -40px);
            }

        }


        /* NAVBAR */

        nav {
            padding: 18px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid rgba(255,255,255,0.15);

            position: sticky;
            top: 0;

            z-index: 10;
        }

        nav h2 {
            margin: 0;
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            color: #ff8bd1;
        }


        /* MAIN CONTAINER */

        .container {

            width: 90%;
            max-width: 650px;

            margin: 50px auto;

            padding: 35px;

            border-radius: 28px;

            background:
                rgba(255,255,255,0.10);

            border:
                1px solid rgba(255,255,255,0.20);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }


        /* TITLE */

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ddd;
            margin-bottom: 30px;
            font-size: 14px;
        }


        /* FORM */

        .form-group {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }


        /* SELECT BOX */

        select {

            width: 100%;

            height: 50px;

            padding: 0 15px;

            border: none;

            border-radius: 13px;

            outline: none;

            background: white;

            color: #222;

            font-size: 15px;

            cursor: pointer;

        }


        /* PLACEHOLDER */

        select:invalid {
            color: #777;
        }

        option {
            color: #222;
            background: white;
        }


        /* BUTTON */

        button {

            width: 100%;

            height: 52px;

            margin-top: 30px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    90deg,
                    #8b5cf6,
                    #ec4899
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(236,72,153,0.35);
        }


        /* MESSAGE */

        #message {

            text-align: center;

            margin-top: 18px;

            min-height: 22px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .container {
                margin-top: 30px;
                padding: 25px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>


    <!-- NAVBAR -->

    <nav>

        <h2>✨ Fashion Trend</h2>

        <div>

            <a href="/home">Home</a>

            <a href="/trend">Trend</a>

            <a href="/feedback">Feedback</a>

            <a href="/logout">Logout</a>

        </div>

    </nav>


    <!-- FORM -->

    <div class="container">

        <h1>
            Create Your Fashion Trend ✨
        </h1>

        <p class="subtitle">
            Select your preferences and create a fashion trend
        </p>


        <!-- GENDER -->

        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select id="gender" required>

                <option value="" selected disabled>
                    Select Gender
                </option>

                <option value="Women">
                    Women
                </option>

                <option value="Men">
                    Men
                </option>

                <option value="Kids">
                    Kids
                </option>

            </select>

        </div>


        <!-- SEASON -->

        <div class="form-group">

            <label for="season">
                Season
            </label>

            <select id="season" required>

                <option value="" selected disabled>
                    Select Season
                </option>

                <option value="Summer">
                    Summer
                </option>

                <option value="Winter">
                    Winter
                </option>

                <option value="Autumn">
                    Autumn
                </option>

            </select>

        </div>


        <!-- CATEGORY -->

        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="" selected disabled>
                    Select Category
                </option>

                <option value="Dress">
                    Dress
                </option>

                <option value="Tops">
                    Tops
                </option>

                <option value="Jeans">
                    Jeans
                </option>

                <option value="Shirt">
                    Shirt
                </option>

                <option value="Kids">
                    Kids
                </option>

            </select>

        </div>


        <!-- COLOUR -->

        <div class="form-group">

            <label for="colour">
                Colour
            </label>

            <select id="colour" required>

                <option value="" selected disabled>
                    Select Colour
                </option>

                <option value="Lavender">
                    Lavender
                </option>

                <option value="Pink">
                    Pink
                </option>

                <option value="Black">
                    Black
                </option>

                <option value="White">
                    White
                </option>

                <option value="Blue">
                    Blue
                </option>

                <option value="Purple">
                    Purple
                </option>

            </select>

        </div>


        <!-- STYLE -->

        <div class="form-group">

            <label for="style">
                Style
            </label>

            <select id="style" required>

                <option value="" selected disabled>
                    Select Style
                </option>

                <option value="Modern">
                    Modern
                </option>

                <option value="Western">
                    Western
                </option>

                <option value="Casual">
                    Casual
                </option>

            </select>

        </div>


        <!-- BUTTON -->

        <button onclick="createTrend()">

            ✨ Create Trend

        </button>


        <div id="message"></div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        async function createTrend() {

            const gender =
                document.getElementById("gender").value;

            const season =
                document.getElementById("season").value;

            const category =
                document.getElementById("category").value;

            const colour =
                document.getElementById("colour").value;

            const style =
                document.getElementById("style").value;


            const message =
                document.getElementById("message");


            /* CHECK ALL SELECTIONS */

            if (
                !gender ||
                !season ||
                !category ||
                !colour ||
                !style
            ) {

                message.textContent =
                    "Please select all options.";

                return;
            }


            const data = {

                gender: gender,

                season: season,

                category: category,

                colour: colour,

                style: style

            };


            message.textContent =
                "Creating your fashion trend...";


            try {

                const response =
                    await fetch(
                        "/api/create-trend",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    message.textContent =
                        "✨ Trend created successfully!";

                    setTimeout(function() {

                        window.location.href =
                            "/recommendation";

                    }, 700);

                }

                else {

                    message.textContent =
                        result.message ||
                        "Unable to create trend.";

                }

            }

            catch (error) {

                console.error(error);

                message.textContent =
                    "Server connection error.";

            }

        }

    </script>


</body>

</html>
